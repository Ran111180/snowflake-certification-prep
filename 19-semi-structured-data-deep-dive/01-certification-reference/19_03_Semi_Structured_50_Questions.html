(function(){var qs=[
{q:"What Snowflake data type stores semi-structured data (JSON, Avro, XML)?",o:["VARCHAR","OBJECT","VARIANT","BINARY"],a:2,e:"VARIANT is the universal semi-structured type. It can hold JSON objects, arrays, strings, numbers, booleans, and null."},
{q:"What is the maximum size of a single VARIANT value?",o:["1 MB","16 MB","64 MB","Unlimited"],a:1,e:"A single VARIANT value can be up to 16 MB compressed. Larger documents must be split."},
{q:"How do you access a nested field 'city' inside 'address' in a VARIANT column 'data'?",o:["data.address.city","data->address->city","data['address']['city']","Both A and C work"],a:3,e:"Snowflake supports both dot notation (data:address.city) and bracket notation (data['address']['city']). Note: in actual SQL it's colon notation: data:address.city"},
{q:"What function converts a JSON string to VARIANT?",o:["TO_VARIANT()","PARSE_JSON()","JSON_PARSE()","CAST(x AS VARIANT)"],a:1,e:"PARSE_JSON('json_string') converts a JSON string into a VARIANT value. TRY_PARSE_JSON is the safe version."},
{q:"What does LATERAL FLATTEN do?",o:["Compresses a table","Explodes an array or object into rows (one row per element)","Converts columns to rows","Merges multiple tables"],a:1,e:"LATERAL FLATTEN takes an array or object and produces one row per element/key-value pair, similar to UNNEST in other databases."},
{q:"Are VARIANT column keys case-sensitive?",o:["No — always case-insensitive","Yes — keys are case-sensitive (must match exact case)","Only for JSON","Only for XML"],a:1,e:"VARIANT/JSON keys ARE case-sensitive. data:Name and data:name refer to different fields. Use double quotes if needed."},
{q:"What is the difference between OBJECT and VARIANT types?",o:["OBJECT only holds key-value pairs; VARIANT holds any JSON type (object, array, scalar)","No difference","VARIANT is smaller","OBJECT supports SQL operations"],a:0,e:"VARIANT holds any semi-structured value. OBJECT specifically holds key-value mappings. ARRAY holds ordered lists."},
{q:"How do you cast a VARIANT field to a specific type?",o:["CONVERT(field, type)","field::TYPE (double-colon cast)","CAST_VARIANT(field, type)","TYPE(field)"],a:1,e:"Use :: casting: data:price::DECIMAL(10,2) or data:name::VARCHAR. Without casting, values remain VARIANT."},
{q:"What does TYPEOF() return for a VARIANT value?",o:["The Snowflake SQL type","The JSON type name (OBJECT, ARRAY, VARCHAR, INTEGER, etc.)","The byte size","The column name"],a:1,e:"TYPEOF returns the type of the VARIANT value: NULL_VALUE, BOOLEAN, INTEGER, DOUBLE, VARCHAR, ARRAY, OBJECT."},
{q:"What is the correct syntax for FLATTEN?",o:["FLATTEN(column)","TABLE(FLATTEN(input => column))","EXPLODE(column)","UNNEST(column)"],a:1,e:"Full syntax: TABLE(FLATTEN(INPUT => expr, PATH => 'path', OUTER => true/false, RECURSIVE => true/false, MODE => 'OBJECT'|'ARRAY'|'BOTH'))"},
{q:"What does FLATTEN's OUTER => TRUE do?",o:["Flattens only outer arrays","Includes rows for NULL/empty arrays (like LEFT JOIN behavior)","Removes outer braces","Flattens external tables"],a:1,e:"OUTER => TRUE keeps rows that have NULL or empty arrays (producing NULL in flattened columns). Default FALSE would skip them."},
{q:"What columns does FLATTEN produce?",o:["Only VALUE","SEQ, KEY, PATH, INDEX, VALUE, THIS","ELEMENT and POSITION","ROW_NUM and DATA"],a:1,e:"FLATTEN produces: SEQ (sequence), KEY (for objects), PATH, INDEX (for arrays), VALUE (the element), THIS (the original input)."},
{q:"What is RECURSIVE => TRUE in FLATTEN?",o:["Flattens only the first level","Flattens all nested levels recursively","Creates recursive CTEs","Enables circular reference handling"],a:1,e:"RECURSIVE => TRUE flattens all levels of nesting, producing rows for every nested element at every depth."},
{q:"How do you load a JSON file into a VARIANT column?",o:["COPY INTO table FROM @stage FILE_FORMAT=(TYPE='JSON')","INSERT INTO table SELECT * FROM @stage","LOAD JSON FROM @stage","IMPORT JSON @stage INTO table"],a:0,e:"COPY INTO with TYPE='JSON' loads JSON files. Each JSON object becomes one VARIANT value in the target column."},
{q:"What does STRIP_OUTER_ARRAY = TRUE do when loading JSON?",o:["Removes the outer [] from a JSON array, loading each element as a separate row","Strips whitespace","Removes outer {}","Flattens nested arrays"],a:0,e:"If your JSON file is an array [obj1, obj2, ...], STRIP_OUTER_ARRAY splits it so each element becomes a separate row."},
{q:"What is OBJECT_CONSTRUCT used for?",o:["Building a VARIANT object from key-value pairs","Parsing JSON strings","Creating tables","Defining schemas"],a:0,e:"OBJECT_CONSTRUCT('key1', val1, 'key2', val2) builds a VARIANT object from SQL values. Useful for creating JSON output."},
{q:"What does ARRAY_AGG do?",o:["Flattens an array","Aggregates values into a VARIANT array","Counts array elements","Sorts arrays"],a:1,e:"ARRAY_AGG(column) aggregates multiple rows into a single VARIANT array. The inverse of FLATTEN."},
{q:"What is ARRAY_SIZE?",o:["Returns the byte size of an array","Returns the number of elements in a VARIANT array","Returns the max element","Resizes an array"],a:1,e:"ARRAY_SIZE(array) returns the count of elements. Returns NULL if the input is not an array."},
{q:"What happens when you query a VARIANT key that doesn't exist?",o:["Error thrown","Returns NULL","Returns empty string","Returns FALSE"],a:1,e:"Accessing a non-existent key returns NULL (no error). This makes VARIANT queries safe but requires careful NULL handling."},
{q:"What is the difference between NULL and JSON null in VARIANT?",o:["No difference","SQL NULL = missing; JSON null = explicit null value (they behave differently in IS NULL checks)","JSON null is invalid","SQL NULL is stored as 'null' string"],a:1,e:"SQL NULL means 'field absent'. JSON null is a valid value meaning 'explicitly null'. Use IS NULL for SQL NULL; = 'null'::VARIANT for JSON null."},
{q:"Can you create indexes on VARIANT columns?",o:["Yes — standard B-tree indexes","No — but Search Optimization Service (SOS) can optimize VARIANT queries","Yes — with special syntax","Only for top-level keys"],a:1,e:"No traditional indexes, but SOS can be enabled to optimize equality/IN queries on semi-structured data paths."},
{q:"What does GET_PATH(v, 'a.b.c') do?",o:["Returns the schema path","Extracts the value at the nested path a.b.c from VARIANT v","Creates a file path","Returns the path as a string"],a:1,e:"GET_PATH (or GET) extracts a value at a dot-separated path. Equivalent to v:a.b.c but works with dynamic paths."},
{q:"How does Snowflake store VARIANT columns internally?",o:["As plain JSON text","As compressed columnar data with type metadata per value","As BLOB","As separate tables per key"],a:1,e:"Snowflake stores VARIANT in a columnar format with optimizations. It also auto-detects repeated paths and stores them efficiently."},
{q:"What is OBJECT_KEYS?",o:["Returns all keys of a VARIANT object as an ARRAY","Lists column names","Shows primary keys","Returns object size"],a:0,e:"OBJECT_KEYS(variant_object) returns an ARRAY of all top-level key names in the object."},
{q:"Can VARIANT data be used in JOIN conditions?",o:["No — must cast first","Yes — but must cast to a specific type first for reliable comparison","Only for equality joins","Automatic without casting"],a:1,e:"You should cast VARIANT values to specific types before using in JOINs: ON a.data:id::INT = b.id. Without casting, comparison may be unreliable."},
{q:"What is the performance impact of querying deeply nested VARIANT vs materialized columns?",o:["No difference","VARIANT is faster (compressed)","Materialized columns are faster (columnar pruning works better)","Depends on warehouse size"],a:2,e:"Materialized (extracted) columns enable full partition pruning and statistics. VARIANT queries can't prune as effectively for nested paths."},
{q:"What does ARRAY_CONTAINS do?",o:["Checks if an array contains a specific value","Checks if a value is an array","Returns contained arrays","Merges arrays"],a:0,e:"ARRAY_CONTAINS(value, array) returns TRUE if the array contains the specified value."},
{q:"What does ARRAY_SLICE(arr, 2, 5) return?",o:["Elements at index 2 and 5","Elements from index 2 to 4 (exclusive end)","First 5 elements","Last 3 elements"],a:1,e:"ARRAY_SLICE returns elements from start index (inclusive) to end index (exclusive). ARRAY_SLICE(arr, 2, 5) = elements at index 2, 3, 4."},
{q:"What file formats support semi-structured data loading?",o:["Only JSON","JSON, Avro, Parquet, ORC, XML","Only JSON and XML","Only Parquet"],a:1,e:"Snowflake can load semi-structured data from JSON, Avro, Parquet, ORC, and XML formats into VARIANT columns."},
{q:"What does TRY_PARSE_JSON do differently from PARSE_JSON?",o:["Parses faster","Returns NULL instead of error for invalid JSON","Handles larger files","Validates schema"],a:1,e:"TRY_PARSE_JSON returns NULL for invalid JSON strings instead of raising an error. Safer for data with potential formatting issues."},
{q:"How do you flatten a JSON array field 'items' in column 'data'?",o:["SELECT f.value FROM my_table, LATERAL FLATTEN(input => data:items) f","SELECT FLATTEN(data:items) FROM my_table","SELECT data:items[] FROM my_table","SELECT EXPLODE(data.items) FROM my_table"],a:0,e:"LATERAL FLATTEN with input => path produces one row per array element. The alias (f) gives access to f.value, f.index, etc."},
{q:"Can you use GROUP BY on a VARIANT column?",o:["Yes — directly","No — must cast to a scalar type first","Only with ARRAY types","Only in subqueries"],a:1,e:"You must cast VARIANT values before using in GROUP BY: GROUP BY data:region::VARCHAR. Raw VARIANT grouping is not supported."},
{q:"What is OBJECT_INSERT?",o:["Inserts a row into a table","Adds or updates a key-value pair in a VARIANT object","Inserts an object into an array","Creates a new object type"],a:1,e:"OBJECT_INSERT(obj, 'key', value) returns a new object with the key added/updated. Objects are immutable — returns new copy."},
{q:"What is OBJECT_DELETE?",o:["Deletes an object from the database","Removes a key from a VARIANT object (returns new object)","Drops a table","Removes NULL values"],a:1,e:"OBJECT_DELETE(obj, 'key') returns a new object without the specified key. Does not modify in place."},
{q:"What does ARRAY_APPEND do?",o:["Adds an element to the end of an array (returns new array)","Concatenates two arrays","Removes last element","Sorts the array"],a:0,e:"ARRAY_APPEND(array, value) returns a new array with the value added at the end."},
{q:"What does ARRAY_CAT do?",o:["Categories array elements","Concatenates two arrays into one","Flattens nested arrays","Counts elements"],a:1,e:"ARRAY_CAT(array1, array2) combines two arrays into a single array."},
{q:"What is the XMLGET function used for?",o:["Loading XML files","Extracting elements from XML-typed VARIANT data","Converting XML to JSON","Validating XML"],a:1,e:"XMLGET extracts child elements from XML VARIANT data by tag name and optionally by instance number."},
{q:"How do you load XML into Snowflake?",o:["Only by converting to JSON first","COPY INTO with FILE_FORMAT = (TYPE = 'XML')","Using XMLPARSE function","XML is not supported"],a:1,e:"XML files are loaded via COPY INTO with TYPE='XML'. Each XML document becomes a VARIANT value."},
{q:"What happens when FLATTEN is applied to a scalar (non-array, non-object) value?",o:["Returns one row with the scalar as VALUE","Returns zero rows","Throws an error","Returns NULL"],a:0,e:"Flattening a scalar produces one row with that scalar as the VALUE. Not an error, but typically not useful."},
{q:"How do you check if a VARIANT value is an array?",o:["IS_ARRAY(value)","TYPEOF(value) = 'ARRAY'","Both A and B work","ARRAY_CHECK(value)"],a:2,e:"Both IS_ARRAY() and checking TYPEOF() = 'ARRAY' work. IS_ARRAY is more concise."},
{q:"Can you create a view that materializes (extracts) VARIANT paths into typed columns?",o:["No — views are always logical","Yes — and it improves query performance for those paths","Only with Dynamic Tables","Only with MATERIALIZED keyword"],a:1,e:"Creating a view with casted VARIANT paths (data:name::VARCHAR) makes queries easier and more performant when combined with other optimizations."},
{q:"What does FLATTEN MODE => 'BOTH' do?",o:["Flattens only objects","Flattens only arrays","Flattens both objects (producing key-value rows) AND arrays (producing index-value rows)","Flattens in both directions"],a:2,e:"MODE='BOTH' means FLATTEN will produce rows for both array elements and object key-value pairs."},
{q:"What is PARSE_XML used for?",o:["Loading XML files from stage","Converting an XML string into a VARIANT/OBJECT value","Validating XML syntax","Querying XML namespaces"],a:1,e:"PARSE_XML converts an XML string into a Snowflake OBJECT/VARIANT value that can be queried with XMLGET."},
{q:"Can you use VARIANT columns in WHERE clauses?",o:["No — filtering not supported","Yes — with casting: WHERE data:status::VARCHAR = 'active'","Only with = operator","Only for top-level keys"],a:1,e:"You can filter on VARIANT paths but should cast for reliable comparison and to enable pruning: WHERE data:age::INT > 30."},
{q:"What function creates an array from literal values?",o:["ARRAY_CONSTRUCT(1, 2, 3)","MAKE_ARRAY(1, 2, 3)","[1, 2, 3]","ARRAY(1, 2, 3)"],a:0,e:"ARRAY_CONSTRUCT(val1, val2, ...) creates a VARIANT array from the provided values."},
{q:"What is ARRAY_DISTINCT?",o:["Returns distinct arrays across rows","Returns a new array with duplicate elements removed","Checks if all elements are distinct","Counts distinct elements"],a:1,e:"ARRAY_DISTINCT(array) returns a new array containing only unique elements."},
{q:"What does the colon (:) operator do in Snowflake SQL?",o:["String concatenation","Traverses into VARIANT/OBJECT data (path access)","Variable binding","Array slicing"],a:1,e:"The colon is the path operator for VARIANT: data:field accesses 'field' key. Equivalent to data['field']. Case-sensitive."},
{q:"What is OBJECT_AGG?",o:["Counts objects","Aggregates key-value pairs from multiple rows into a single VARIANT object","Averages object values","Groups objects by key"],a:1,e:"OBJECT_AGG(key_expr, value_expr) aggregates rows into one VARIANT object. Each row contributes one key-value pair."},
{q:"Can Parquet files with nested structures be loaded into Snowflake?",o:["No — only flat Parquet","Yes — nested structures map to VARIANT","Only with manual schema definition","Only the top level is loaded"],a:1,e:"Parquet nested types (structs, arrays, maps) are loaded as nested VARIANT values. Snowflake preserves the structure."},
