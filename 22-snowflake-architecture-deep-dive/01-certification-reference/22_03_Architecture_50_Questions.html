<script>
(function(){var qs=[
{q:"What are the three layers of Snowflake's architecture?",o:["Storage, Compute, Cloud Services","Ingestion, Processing, Output","Database, Application, Presentation","Hardware, Software, Network"],a:0,e:"Snowflake has three layers: Storage (data stored in micro-partitions), Compute (virtual warehouses), and Cloud Services (metadata, optimization, security)."},
{q:"Which layer handles query optimization and metadata management?",o:["Storage Layer","Compute Layer","Cloud Services Layer","Network Layer"],a:2,e:"The Cloud Services layer handles query compilation, optimization, metadata, security, and transaction management."},
{q:"What is the size range of a micro-partition in Snowflake?",o:["1-10 MB","50-500 MB uncompressed","1-5 GB","10-50 KB"],a:1,e:"Micro-partitions are 50-500 MB of uncompressed data, organized in a columnar format and compressed for storage."},
{q:"Are micro-partitions mutable (modifiable in place)?",o:["Yes — updates modify in place","No — they are immutable (write-once)","Only for DELETE operations","Only within transactions"],a:1,e:"Micro-partitions are IMMUTABLE. Any DML creates new micro-partitions. Old ones are retained for Time Travel."},
{q:"Can two virtual warehouses query the same data simultaneously?",o:["No — data is locked per warehouse","Yes — shared data architecture allows concurrent access","Only if they're in the same cluster","Only with Enterprise edition"],a:1,e:"This is the core of Snowflake's multi-cluster shared data architecture — any warehouse can read any data without conflict."},
{q:"What is the minimum auto-suspend time for a virtual warehouse?",o:["30 seconds","60 seconds (1 minute)","5 minutes","Never — must be manual"],a:1,e:"The minimum auto-suspend time is 60 seconds. After this period of inactivity, the warehouse automatically suspends."},
{q:"How long does Snowflake's result cache persist?",o:["1 hour","24 hours","7 days","Until warehouse suspends"],a:1,e:"Result cache persists for 24 hours. If the same query is run and underlying data hasn't changed, cached results are returned instantly."},
{q:"Where is the result cache stored?",o:["In the virtual warehouse","In the Cloud Services layer","In the storage layer","In the client application"],a:1,e:"Result cache is in the Cloud Services layer — it persists even if the warehouse is suspended and is available across warehouses."},
{q:"What invalidates the result cache?",o:["Only time (24 hours)","Underlying data changes OR 24 hours OR different query text","Only warehouse suspend","Only user logout"],a:1,e:"Result cache is invalidated by: data changes in underlying tables, 24-hour expiry, or any difference in query text/session parameters."},
{q:"Does Snowflake charge for queries served from result cache?",o:["Yes — normal warehouse credits","No — no compute charges for cached results","Half the normal credit rate","Only on Enterprise edition"],a:1,e:"Result cache queries are FREE — no warehouse needs to start, no credits consumed."},
{q:"What is the Cloud Services billing model?",o:["Always charged separately","Free up to 10% of daily compute; excess is billed","Flat monthly fee","Included in storage costs"],a:1,e:"Cloud Services compute is free up to 10% of daily warehouse consumption. Only excess beyond 10% is billed."},
{q:"Which Snowflake edition allows up to 90 days of Time Travel?",o:["Standard","Enterprise (and above)","Business Critical only","VPS only"],a:1,e:"Enterprise edition (and above) supports up to 90 days. Standard edition is limited to 1 day maximum."},
{q:"What is the maximum Time Travel retention for Standard edition?",o:["0 days","1 day","7 days","30 days"],a:1,e:"Standard edition supports a maximum of 1 day (DATA_RETENTION_TIME_IN_DAYS = 0 or 1 only)."},
{q:"What cloud platforms does Snowflake run on?",o:["AWS only","AWS and Azure only","AWS, Azure, and GCP","All major clouds including Oracle Cloud"],a:2,e:"Snowflake runs on AWS, Microsoft Azure, and Google Cloud Platform (GCP)."},
{q:"Can a Snowflake account span multiple cloud regions?",o:["Yes — single account across regions","No — each account is in one region; use replication for multi-region","Only with VPS edition","Only on AWS"],a:1,e:"Each Snowflake account exists in a single cloud region. Use database replication and failover for multi-region setups."},
{q:"What format does Snowflake use to store data internally?",o:["Parquet","CSV compressed","Proprietary columnar format (FDN)","JSON"],a:2,e:"Snowflake stores data in its own proprietary columnar format (sometimes called FDN) that is highly compressed and optimized."},
{q:"What is the role of metadata in query optimization?",o:["None — Snowflake scans all data","Enables partition pruning by tracking min/max/count per micro-partition","Only used for caching","Only for security checks"],a:1,e:"Metadata stores min/max values, distinct counts, and null counts per column per micro-partition — enabling partition pruning without scanning."},
{q:"What transaction model does Snowflake use?",o:["Read committed only","ACID with snapshot isolation (MVCC)","Eventual consistency","No transactions"],a:1,e:"Snowflake provides full ACID transactions using snapshot isolation via Multi-Version Concurrency Control (MVCC)."},
{q:"Can readers and writers operate concurrently without blocking?",o:["No — readers block writers","No — writers block readers","Yes — MVCC allows concurrent read/write without blocking","Only in multi-cluster warehouses"],a:2,e:"MVCC (Multi-Version Concurrency Control) allows readers and writers to operate simultaneously without blocking each other."},
{q:"What happens when a warehouse is suspended?",o:["All cached data is lost permanently","Local SSD cache is cleared; result cache persists in Cloud Services","Running queries are cancelled","Data is unloaded from memory"],a:1,e:"Warehouse suspension clears the local SSD cache, but result cache in Cloud Services persists and is available when resumed."},
{q:"What is a multi-cluster warehouse?",o:["A warehouse that spans multiple regions","A warehouse that can auto-scale by adding/removing clusters","A warehouse shared by multiple users","A warehouse with multiple sizes"],a:1,e:"Multi-cluster warehouses auto-scale by adding clusters (scale out) to handle concurrency, or removing them when load decreases."},
{q:"What are the two scaling policies for multi-cluster warehouses?",o:["Fast and Slow","Standard and Economy","Aggressive and Conservative","Auto and Manual"],a:1,e:"Standard: starts clusters quickly to handle queuing. Economy: waits longer (6 min of queuing) before scaling to save credits."},
{q:"What is the smallest warehouse size?",o:["XS (X-Small)","Small","Micro","Nano"],a:0,e:"X-Small (XS) is the smallest warehouse size, consuming 1 credit per hour."},
{q:"How many credits per hour does an XL warehouse consume?",o:["4","8","16","32"],a:2,e:"Credits double with each size: XS=1, S=2, M=4, L=8, XL=16, 2XL=32, 3XL=64, 4XL=128."},
{q:"What is Snowpark-optimized warehouse used for?",o:["Faster SQL queries","ML training and memory-intensive operations","Data loading only","Multi-cluster scaling"],a:1,e:"Snowpark-optimized warehouses have more memory per node — designed for ML training, large DataFrames, and memory-intensive UDFs."},
{q:"Does scaling UP a warehouse (XS→M) improve query concurrency?",o:["Yes — larger warehouses handle more concurrent queries","No — scaling UP improves single query speed; scale OUT for concurrency","Only for complex queries","Only with QAS enabled"],a:1,e:"Scale UP = faster individual queries (more resources). Scale OUT (multi-cluster) = handle more concurrent queries."},
{q:"What is Query Acceleration Service (QAS)?",o:["A caching mechanism","Serverless compute that accelerates portions of eligible queries","A query rewriting optimizer","A pre-computation service"],a:1,e:"QAS uses serverless resources to accelerate portions of eligible queries (those with large scans and selective filters) beyond the warehouse's capacity."},
{q:"What parameter controls QAS intensity?",o:["ACCELERATION_LEVEL","SCALE_FACTOR","QUERY_BOOST","PARALLEL_DEGREE"],a:1,e:"SCALE_FACTOR (1-100) determines how much serverless compute QAS can use relative to the warehouse size."},
{q:"What is a resource monitor?",o:["A monitoring dashboard","An object that tracks credit usage and can trigger actions (notify/suspend)","A warehouse performance tool","A network traffic analyzer"],a:1,e:"Resource monitors track credit consumption and trigger actions (NOTIFY, SUSPEND, SUSPEND_IMMEDIATE) when thresholds are reached."},
{q:"At what threshold levels can resource monitor actions be set?",o:["Only 100%","Any percentage (e.g., 75%, 90%, 100%)","Only 50% and 100%","Only multiples of 25%"],a:1,e:"Resource monitor triggers can be set at any percentage threshold (e.g., notify at 75%, suspend at 90%, kill at 100%)."},
{q:"What is the warehouse local disk cache (SSD cache)?",o:["Stores query results","Caches frequently accessed micro-partition data on warehouse SSDs","Stores user session data","Caches metadata"],a:1,e:"The SSD/local disk cache stores raw micro-partition data on the warehouse's local SSD storage, avoiding repeated cloud storage reads."},
{q:"How is the SSD cache different from result cache?",o:["SSD cache = raw data on warehouse disk; Result cache = final query output in Cloud Services","They are the same thing","SSD cache is slower","Result cache is per-warehouse"],a:0,e:"SSD cache stores raw table data locally on warehouse (warehouse-specific). Result cache stores completed query results in Cloud Services (shared)."},
{q:"What is the metadata cache?",o:["A user-managed cache","Cloud Services layer that stores table statistics for compile-time optimization","A manual invalidation cache","Part of the warehouse"],a:1,e:"The metadata cache in Cloud Services stores statistical information about micro-partitions, enabling query planning and partition pruning."},
{q:"Can the result cache be used across different warehouses?",o:["No — it's warehouse-specific","Yes — it's in Cloud Services, accessible by any warehouse","Only within the same cluster","Only for identical roles"],a:1,e:"Result cache is stored in Cloud Services (not tied to a warehouse). Any warehouse can leverage it if the query matches."},
{q:"What does AUTO_RESUME = TRUE do?",o:["Automatically scales up the warehouse","Automatically starts the warehouse when a query is submitted","Prevents the warehouse from suspending","Resumes failed queries"],a:1,e:"AUTO_RESUME starts a suspended warehouse automatically when a query is submitted against it. No manual intervention needed."},
{q:"What happens to a query when the warehouse is suspended and AUTO_RESUME = FALSE?",o:["Query waits indefinitely","Query fails with an error","Query runs on Cloud Services","Query is queued for 5 minutes"],a:1,e:"If the warehouse is suspended and AUTO_RESUME is FALSE, the query fails with an error indicating the warehouse is not available."},
{q:"What is the purpose of STATEMENT_TIMEOUT_IN_SECONDS?",o:["Sets warehouse suspend time","Kills queries that exceed the specified runtime","Limits connection duration","Sets cache TTL"],a:1,e:"STATEMENT_TIMEOUT automatically cancels queries that exceed the configured number of seconds — preventing runaway queries."},
{q:"What is Snowflake's approach to storage and compute separation?",o:["They share resources","Fully separated — can scale independently without affecting each other","Compute depends on storage size","Storage depends on compute size"],a:1,e:"Storage and compute are fully decoupled. You can scale storage (more data) without changing compute, and scale compute without moving data."},
{q:"What Snowflake edition adds multi-cluster warehouses?",o:["All editions","Enterprise and above","Business Critical only","Standard"],a:0,e:"Multi-cluster warehouses are available in ALL editions (Standard included). They're not edition-restricted."},
{q:"What is the QUEUED state for a query?",o:["Query is waiting for compilation","Query is waiting for warehouse resources (all threads busy)","Query is waiting for data to load","Query has an error"],a:1,e:"QUEUED means the warehouse is at maximum concurrency and the query is waiting for resources to become available."},
{q:"What triggers Snowflake to add a cluster in a multi-cluster warehouse (Standard policy)?",o:["When CPU exceeds 80%","When a query starts queuing","After 6 minutes of sustained load","When storage exceeds 90%"],a:1,e:"Standard policy: adds a cluster as soon as queries start queuing. Economy policy: waits 6 minutes of sustained queuing."},
{q:"Can you resize a warehouse while queries are running?",o:["No — must wait for queries to finish","Yes — running queries use old size; new queries use new size","Only scaling up is allowed","Only with ACCOUNTADMIN role"],a:1,e:"You can resize while queries run. In-flight queries use the current resources; subsequent queries get the new size."},
{q:"What is the billing granularity for warehouse compute?",o:["Per hour","Per minute","Per second (minimum 60 seconds)","Per query"],a:2,e:"Warehouses bill per-second with a 60-second minimum. If you use a warehouse for 61 seconds, you pay for 61 seconds."},
{q:"How does Snowflake handle concurrent DDL on the same object?",o:["Both succeed","Second DDL is queued until first completes (object-level locking)","Both fail","No locking — eventual consistency"],a:1,e:"Snowflake uses object-level locking for DDL. Concurrent DDL on the same object is serialized (queued)."},
{q:"What does the Cloud Services layer do during query execution?",o:["Nothing — only compute works during execution","Compiles SQL, optimizes plan, coordinates execution across warehouse nodes","Stores intermediate results","Manages network routing"],a:1,e:"Cloud Services compiles the query, creates the optimized execution plan, and coordinates how the warehouse nodes execute it."},
{q:"What type of compression does Snowflake use?",o:["Only GZIP","Only LZ4","Automatic per-column compression (Snowflake chooses the best algorithm)","No compression"],a:2,e:"Snowflake automatically selects the best compression algorithm per column based on data characteristics. Users don't control this."},
{q:"What is the maximum number of columns a Snowflake table can have?",o:["1,000","10,000","No practical limit","500"],a:0,e:"Snowflake supports up to approximately 1,000 columns per table (soft limit; contact support for more)."},
{q:"What is the role of the Query Profile?",o:["Shows billing information","Visual execution plan showing operators, partitions scanned, spilling, and performance bottlenecks","Lists all queries in history","Shows warehouse utilization"],a:1,e:"Query Profile provides a visual DAG of execution operators, showing partition pruning stats, bytes scanned, spilling, and bottlenecks."},
{q:"What does 'spilling to remote storage' mean in Query Profile?",o:["Data is being backed up","The warehouse ran out of local memory/disk and is using cloud storage for intermediate results","Results are being cached","Data is being replicated"],a:1,e:"Spilling means the query needs more memory than available. Spilling to local disk is bad; spilling to remote storage is worse. Solution: use a larger warehouse."},
{q:"Which Snowflake edition is required for database failover and replication?",o:["Standard","Enterprise","Business Critical (and above)","All editions"],a:2,e:"Database failover (for disaster recovery) requires Business Critical edition or above."},
{q:"What does SYSTEM$CLUSTERING_INFORMATION return?",o:["Warehouse cluster count","Statistics about how well a table is clustered on specified columns","Network cluster info","Result cache statistics"],a:1,e:"SYSTEM$CLUSTERING_INFORMATION returns clustering depth, overlap, and ratio — showing how well data is physically organized for a given key."}
];var c=0,w=0,a=0,ctr=document.getElementById('qc');function render(){ctr.innerHTML='';qs.forEach(function(q,i){var d=document.createElement('div');d.className='q-block';d.setAttribute('data-answer',q.a);var h='<h3>Q'+(i+1)+'. '+q.q+'</h3>';q.o.forEach(function(o,j){h+='<div class="option" data-opt="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</div>';});h+='<div class="explanation">'+q.e+'</div>';d.innerHTML=h;ctr.appendChild(d);});}function upd(){document.getElementById('cc').textContent=c;document.getElementById('wc').textContent=w;document.getElementById('sp').textContent=a>0?Math.round(c/a*100):0;}ctr.addEventListener('click',function(e){var o=e.target.closest('.option');if(!o||o.classList.contains('disabled'))return;var b=o.closest('.q-block'),os=b.querySelectorAll('.option'),ci=parseInt(b.getAttribute('data-answer')),si=parseInt(o.getAttribute('data-opt'));os.forEach(function(x){x.classList.add('disabled');});if(si===ci){o.classList.add('correct');c++;}else{o.classList.add('wrong');os[ci].classList.add('correct');w++;}a++;b.querySelector('.explanation').classList.add('show');upd();});document.getElementById('rb').addEventListener('click',function(){c=0;w=0;a=0;upd();render();});render();})();
