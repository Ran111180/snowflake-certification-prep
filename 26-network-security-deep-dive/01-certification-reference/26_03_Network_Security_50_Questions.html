    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = 'q-' + idx;
    block.innerHTML = '<div class="q-number">Question ' + (idx + 1) + ' of 50</div>' +
      '<div class="q-text">' + q.q + '</div>' +
      '<ul class="options">' + q.options.map((opt, oi) =>
        '<li data-q="' + idx + '" data-o="' + oi + '">' + String.fromCharCode(65 + oi) + '. ' + opt + '</li>'
      ).join('') + '</ul>' +
      '<div class="explanation" id="exp-' + idx + '"><strong>Explanation:</strong> ' + q.explanation + '</div>';
    container.appendChild(block);
  });
  container.addEventListener('click', handleClick);
}

function handleClick(e) {
  const li = e.target.closest('li[data-q]');
  if (!li || li.classList.contains('disabled')) return;
  const qIdx = parseInt(li.dataset.q);
  const oIdx = parseInt(li.dataset.o);
  const q = questions[qIdx];
  const block = document.getElementById('q-' + qIdx);
  const allOpts = block.querySelectorAll('.options li');
  allOpts.forEach(opt => { opt.classList.add('disabled'); });
  if (oIdx === q.answer) {
    li.classList.add('correct');
    block.classList.add('answered-correct');
    score++;
  } else {
    li.classList.add('incorrect');
    allOpts[q.answer].classList.add('correct');
    block.classList.add('answered-incorrect');
  }
  answered++;
  scoreDisplay.textContent = score + '/' + answered;
  progressDisplay.textContent = answered + ' of 50 answered';
  document.getElementById('exp-' + qIdx).classList.add('visible');
}

document.getElementById('reset-btn').addEventListener('click', function() {
  score = 0; answered = 0;
  scoreDisplay.textContent = '0/0';
  progressDisplay.textContent = '0 of 50 answered';
  renderQuestions();
});

renderQuestions();
</script>
</body>
</html>
